name: Build Fabric 1.21.8 Jar

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # Instala a CLI do Gradle e configura cache básico
      - name: Set up Gradle
        uses: gradle/gradle-build-action@v3

      # ⚡️ Gera um wrapper NOVO na versão 8.13 (serve 8.12+)
      - name: Generate Gradle Wrapper 8.13
        run: |
          gradle --version
          gradle wrapper --gradle-version 8.13 --distribution-type bin
          chmod +x ./gradlew
          ./gradlew --version

      # Build usando o wrapper recém-gerado
      - name: Build with Gradle Wrapper
        run: ./gradlew --no-daemon clean build -x test

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: enhanced-mob-spawners-1.21.8
          path: build/libs/*.jar
