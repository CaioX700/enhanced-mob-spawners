name: Build Fabric 1.21.8 Jar

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
    paths:
      - 'build.gradle'
      - 'settings.gradle'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - 'src/**'
      - 'gradle/wrapper/**'
      - '.github/workflows/build-fabric-1_21_8.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # Instala/Configura Gradle mesmo que o wrapper não exista
      - name: Set up Gradle
        uses: gradle/gradle-build-action@v3

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      # Dá permissão se o wrapper existir
      - name: Make gradlew executable (if present)
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
          fi

      # Build com fallback:
      # se existir ./gradlew usa ele; senão usa 'gradle' instalado pela ação acima
      - name: Build
        run: |
          if [ -x "./gradlew" ]; then
            ./gradlew --no-daemon clean build -x test
          else
            gradle --no-daemon clean build -x test
          fi

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: enhanced-mob-spawners-1.21.8
          path: build/libs/*.jar
