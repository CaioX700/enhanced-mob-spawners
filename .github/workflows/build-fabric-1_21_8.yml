name: Build Fabric 1.21.8 Jar

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
    paths:
      - 'build.gradle'
      - 'gradle.properties'
      - 'src/**'
      - 'gradle/wrapper/gradle-wrapper.properties'
      - '.github/workflows/build-fabric-1_21_8.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew || true

      - name: Build
        run: ./gradlew --stop && ./gradlew clean build -x test

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: enhanced-mob-spawners-1.21.8
          path: build/libs/*.jar
